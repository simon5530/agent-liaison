[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-liaison"
version = "0.1.0"
description = "Synthetic delegated-scheduling broker prototype"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.scripts]
agent-liaison-demo = "agent_liaison.demo:main"

[tool.setuptools.packages.find]
where = ["src"]
